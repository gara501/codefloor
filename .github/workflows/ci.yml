name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: node packages/cli/dist/bin.js build examples/booking-platform/codefloor.json --out /tmp/site
      - run: npm pack -w codefloor --dry-run
      - run: npm test
        env:
          CODEFLOOR_DENYLIST: ${{ secrets.CODEFLOOR_DENYLIST }}
